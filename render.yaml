services:
  # Backend FastAPI Web Service
  - type: web
    name: ai-assistant-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')\""
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: assistant-data
      mountPath: /app/data
      sizeGB: 1

  # Frontend React Static Site
  - type: web
    name: ai-assistant-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-assistant-backend
          property: host

